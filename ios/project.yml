name: RMusic
options:
  bundleIdPrefix: io.bigrandall
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: N9B2H32Q94
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  RMusic:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bigrandall.rmusic
        PRODUCT_NAME: RMusic
        INFOPLIST_FILE: Config/RMusic-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/RMusic.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - target: RMusicWidgets
        embed: true

  RMusicWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widgets
    resources:
      - WidgetResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bigrandall.rmusic.widgets
        PRODUCT_NAME: RMusicWidgets
        INFOPLIST_FILE: Config/RMusicWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/RMusicWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES

  RMusicTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests
    dependencies:
      - target: RMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bigrandall.rmusic.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RMusic:
    build:
      targets:
        RMusic: all
        RMusicWidgets: all
        RMusicTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RMusicTests
